name: Build ZipCheck APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Check APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v0.1.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" 'app/build/outputs/apk/debug/app-debug.apk#ZipCheck-Android.apk' --title "ZipCheck prototype $TAG" --notes "Demo-only debug APK. Do not enter real private address or photos." --latest
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/ZipCheck-Android.apk" >> "$GITHUB_STEP_SUMMARY"
