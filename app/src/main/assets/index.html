<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F7FAFD" />
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="description" content="집체크 - 입퇴거 주택상태 공동점검 시제품"/>
  <link rel="stylesheet" href="v2.css"/>
  <link rel="manifest" href="manifest.webmanifest"/>
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png"/>
  <title>집체크 ZipCheck | 안드로이드 시제품</title>
  <style>
    :root{
      --bg:#F7FAFD;
      --bg2:#EEF5FA;
      --card:#FFFFFF;
      --ink:#0E2B66;
      --text:#304667;
      --muted:#6E819E;
      --line:#D9E4F0;
      --navy:#0E2B66;
      --navy-2:#1E4D8F;
      --teal:#23B4B6;
      --teal-soft:#E8FAFA;
      --orange:#F5A24A;
      --orange-soft:#FFF1DF;
      --blue-soft:#EDF3FF;
      --green-soft:#E8F8F2;
      --shadow:0 18px 40px rgba(17,49,95,.08);
      --shadow-soft:0 8px 20px rgba(24,54,97,.06);
      --radius-xl:28px;
      --radius-lg:20px;
      --radius-md:14px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
      color:var(--text);
      background:radial-gradient(circle at top left, #ffffff 0%, #F7FAFD 42%, #F2F6FB 100%);
      line-height:1.55;
    }
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    button:disabled{opacity:.55;cursor:not-allowed}
    a{text-decoration:none;color:inherit}
    .shell{max-width:1200px;margin:0 auto;padding:0 24px 88px}
    .site-header{
      min-height:92px;display:flex;align-items:center;justify-content:space-between;gap:16px;
      border-bottom:1px solid rgba(14,43,102,.08);
    }
    .brand{display:flex;align-items:center;gap:14px;white-space:nowrap}
    .brand-logo{width:54px;height:54px;display:grid;place-items:center;background:white;border-radius:16px;box-shadow:var(--shadow-soft);border:1px solid rgba(14,43,102,.08)}
    .brand-logo svg{display:block}
    .brand-copy strong{display:block;font-size:23px;line-height:1;color:var(--navy);letter-spacing:-1px}
    .brand-copy span{display:block;font-size:11px;letter-spacing:3px;color:var(--muted);margin-top:6px}
    .toplinks{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .navbtn{
      border:1px solid transparent;background:transparent;color:var(--muted);
      border-radius:999px;padding:11px 16px;font-size:14px;font-weight:700;
      transition:.18s ease;
    }
    .navbtn:hover{background:rgba(35,180,182,.08);color:var(--navy)}
    .navbtn.active{background:var(--teal-soft);color:var(--navy);border-color:rgba(35,180,182,.14)}
    .demo-label{
      white-space:nowrap;border-radius:999px;padding:8px 12px;font-size:11px;font-weight:800;
      color:#9A6B28;background:var(--orange-soft);letter-spacing:.2px
    }
    .role-strip{
      display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:22px 0 10px;
    }
    .role-caption{font-size:13px;font-weight:800;color:var(--muted);margin-right:6px}
    .role-btn{
      border:1px solid var(--line);background:#fff;color:var(--muted);
      border-radius:12px;padding:9px 15px;font-size:13px;font-weight:700;transition:.18s ease;
      box-shadow:0 3px 10px rgba(17,49,95,.03)
    }
    .role-btn.active{background:var(--navy);color:#fff;border-color:var(--navy)}
    .hero{
      display:grid;grid-template-columns:1.32fr .88fr;gap:22px;align-items:stretch;margin:12px 0 34px;
    }
    .hero-main{
      min-height:328px;padding:34px 36px;border-radius:var(--radius-xl);
      background:linear-gradient(135deg, rgba(255,255,255,.98) 0%, rgba(237,245,255,.94) 42%, rgba(233,250,248,.92) 100%);
      border:1px solid rgba(14,43,102,.08);
      box-shadow:var(--shadow);position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;
    }
    .hero-main:before{
      content:'';position:absolute;right:-50px;top:-70px;width:300px;height:300px;border-radius:50%;
      background:radial-gradient(circle, rgba(35,180,182,.14) 0%, rgba(35,180,182,.06) 42%, rgba(35,180,182,0) 72%);
      pointer-events:none;
    }
    .hero-main:after{
      content:'';position:absolute;right:54px;bottom:20px;width:190px;height:190px;border:2px solid rgba(35,180,182,.14);
      border-radius:44px;transform:rotate(18deg);pointer-events:none;
    }
    .eyebrow{
      display:inline-block;font-size:12px;font-weight:800;letter-spacing:2.2px;color:var(--muted);
      text-transform:uppercase;margin-bottom:10px
    }
    .eyebrow::after{content:'';display:block;width:50px;height:4px;background:var(--teal);border-radius:4px;margin-top:9px}
    h1{margin:0;font-size:50px;line-height:1.18;letter-spacing:-2px;color:var(--navy)}
    .accent{color:var(--teal)}
    .headline-sub{display:block;color:var(--text);font-size:17px;margin-top:18px;max-width:500px}
    .accent-swoosh{
      display:inline-block;margin-left:6px;position:relative
    }
    .accent-swoosh:after{
      content:'';position:absolute;left:0;right:-8px;bottom:-8px;height:8px;background:linear-gradient(90deg,var(--orange),#FDBA62);
      border-radius:999px;opacity:.95;transform:skewX(-18deg)
    }
    .feature-pills{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
    .pill{
      display:inline-flex;align-items:center;gap:9px;padding:11px 15px;border-radius:999px;font-size:14px;font-weight:800;
      box-shadow:0 6px 16px rgba(17,49,95,.04)
    }
    .pill.teal{background:var(--teal-soft);color:var(--navy)}
    .pill.blue{background:var(--blue-soft);color:var(--navy)}
    .pill.orange{background:var(--orange-soft);color:var(--navy)}
    .pill .icon{font-size:16px}
    .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
    .btn{
      border:1px solid transparent;border-radius:14px;padding:13px 18px;font-size:14px;font-weight:800;
      display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:.18s ease;
    }
    .btn.primary{background:linear-gradient(135deg,var(--navy) 0%, var(--navy-2) 100%);color:#fff;box-shadow:0 14px 28px rgba(14,43,102,.18)}
    .btn.primary:hover{transform:translateY(-1px)}
    .btn.secondary{background:#fff;color:var(--navy);border-color:var(--line)}
    .btn.secondary:hover,.btn.ghost:hover{border-color:#b7c9df;background:#fbfdff}
    .btn.ghost{background:#fff;color:var(--muted);border-color:var(--line)}
    .btn.warn{background:var(--orange-soft);color:#9A6B28}
    .summary{
      border-radius:var(--radius-xl);padding:26px;background:linear-gradient(180deg,#FFFFFF 0%, #FBFDFF 100%);
      border:1px solid rgba(14,43,102,.08);box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden
    }
    .summary:before{content:'';position:absolute;inset:auto -50px -80px auto;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle, rgba(14,43,102,.08) 0%, rgba(14,43,102,0) 72%)}
    .sum-title{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.2px}
    .sum-number{margin-top:8px;font-size:48px;font-weight:900;line-height:1;letter-spacing:-2px;color:var(--navy)}
    .sum-number span{font-size:17px;font-weight:700;color:var(--muted);margin-left:4px}
    .sum-rule{height:1px;background:linear-gradient(90deg, rgba(14,43,102,.07), rgba(14,43,102,0));margin:18px 0}
    .hint{font-size:13px;color:var(--muted)}
    .summary-chip{display:inline-flex;align-items:center;gap:8px;background:var(--teal-soft);color:var(--navy);padding:9px 12px;border-radius:999px;font-size:12px;font-weight:800;margin-top:14px}
    .section-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin:34px 0 15px}
    .section-head h2{margin:0;font-size:24px;line-height:1.2;color:var(--navy);letter-spacing:-1px}
    .section-head p{margin-top:5px;font-size:13px;color:var(--muted)}
    .text-btn{border:none;background:transparent;color:var(--navy);font-size:13px;font-weight:800}
    .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
    .card{
      border:1px solid rgba(14,43,102,.08);background:white;border-radius:18px;padding:20px;box-shadow:var(--shadow-soft)
    }
    .record-card{display:flex;flex-direction:column;min-height:200px;cursor:pointer;transition:transform .15s ease,border-color .15s ease, box-shadow .15s ease}
    .record-card:hover{transform:translateY(-3px);border-color:rgba(35,180,182,.34);box-shadow:0 18px 26px rgba(24,54,97,.09)}
    .card-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
    .tag{display:inline-block;padding:6px 10px;border-radius:999px;font-size:11px;font-weight:900;letter-spacing:.2px;background:var(--teal-soft);color:var(--navy)}
    .tag.orange{background:var(--orange-soft);color:#9A6B28}
    .tag.gray{background:#F2F6FB;color:var(--muted)}
    .date{font-size:12px;color:var(--muted)}
    .card h3{margin:18px 0 8px;font-size:19px;line-height:1.38;letter-spacing:-.6px;color:var(--navy)}
    .meta{font-size:13px;color:var(--muted)}
    .card-bottom{margin-top:auto;padding-top:18px;color:var(--teal);font-size:13px;font-weight:800}
    .empty{
      padding:56px 24px;text-align:center;background:linear-gradient(180deg,#fff 0%, #fbfdff 100%);
      border:1px dashed #C9D9E8;border-radius:22px;color:var(--muted)
    }
    .empty strong{display:block;color:var(--navy);font-size:18px;margin-bottom:8px}
    .flowgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-top:20px}
    .flowstep{background:#fff;border:1px solid rgba(14,43,102,.08);border-radius:20px;padding:20px;box-shadow:var(--shadow-soft);position:relative;overflow:hidden}
    .flowstep:after{content:'';position:absolute;right:-24px;bottom:-24px;width:88px;height:88px;border-radius:24px;background:rgba(35,180,182,.08);transform:rotate(24deg)}
    .stepnum{color:var(--teal);font-size:12px;font-weight:900;letter-spacing:.4px}
    .flowstep h3{margin:10px 0 7px;font-size:17px;color:var(--navy)}
    .flowstep p{font-size:13px;color:var(--muted);position:relative;z-index:1}
    .page-head{margin:22px 0 20px}
    .page-head h1{font-size:34px;line-height:1.2;margin:6px 0;color:var(--navy)}
    .page-head p{font-size:14px;color:var(--muted)}
    .panel{
      background:linear-gradient(180deg,#FFFFFF 0%, #FBFDFF 100%);border:1px solid rgba(14,43,102,.08);
      border-radius:22px;padding:28px;margin-bottom:18px;box-shadow:var(--shadow-soft)
    }
    .panel h2{font-size:20px;letter-spacing:-.6px;margin:0 0 18px;color:var(--navy)}
    .field-grid{display:grid;grid-template-columns:1fr 1fr;gap:17px}
    .field label,.label{display:block;font-weight:800;font-size:13px;margin-bottom:8px;color:var(--navy)}
    .field input,.field select,.field textarea,textarea.comment{
      display:block;width:100%;min-height:48px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;outline:none;
      background:#fff;color:var(--text);font-size:14px;transition:border-color .15s ease, box-shadow .15s ease
    }
    .field input:focus,.field select:focus,.field textarea:focus,textarea.comment:focus{border-color:rgba(35,180,182,.72);box-shadow:0 0 0 4px rgba(35,180,182,.12)}
    textarea{resize:vertical}
    .room-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
    .room{
      border:1px solid rgba(14,43,102,.08);border-radius:18px;padding:18px;background:linear-gradient(180deg,#FFFFFF 0%, #F9FCFF 100%)
    }
    .room h3{margin:0 0 14px;font-size:17px;color:var(--navy)}
    .room .field{margin-bottom:12px}.room .field:last-child{margin-bottom:0}
    .file-input{width:100%;font-size:12px;max-width:100%}
    .file-input::file-selector-button{
      border:1px solid #CFE0EF;border-radius:10px;background:var(--blue-soft);color:var(--navy);font-weight:800;padding:8px 12px;margin-right:10px
    }
    .photo-list{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
    .photo-mini{width:72px;height:68px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
    .form-actions{display:flex;justify-content:flex-end;gap:10px;margin:24px 0}
    .detail-grid{display:grid;grid-template-columns:1fr 320px;align-items:start;gap:18px}
    .detail-list{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .detail-room{border:1px solid rgba(14,43,102,.08);border-radius:16px;background:linear-gradient(180deg,#fff 0%, #fafdff 100%);padding:18px}
    .detail-room strong{display:block;font-size:16px;color:var(--navy)}
    .detail-room p{font-size:13px;color:var(--muted);margin-top:7px;min-height:24px}
    .detail-room .photos{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
    .detail-room img{width:90px;height:88px;border-radius:10px;object-fit:cover;cursor:zoom-in;border:1px solid var(--line)}
    .state-label{display:inline-block;font-size:12px;font-weight:900;margin-top:8px;padding:6px 10px;border-radius:999px;background:var(--teal-soft);color:var(--navy)}
    .timeline{display:flex;flex-direction:column;gap:12px}
    .event{border-left:3px solid #BFD2E5;padding-left:13px}
    .event strong{font-size:13px;color:var(--navy)}
    .event p{font-size:13px;color:var(--muted);margin:3px 0}.event small{color:#90A1B8;font-size:11px}
    .check{font-size:14px;margin:10px 0;padding:12px 13px;border-radius:13px;background:#F3F8FC;color:var(--text);font-weight:700}
    .check.done{background:var(--green-soft);color:#14785E}
    .confirm-panel{margin-top:20px;border-top:1px solid rgba(14,43,102,.08);padding-top:18px}
    .confirm-panel textarea{height:100px;margin:12px 0}
    .aside h3{font-size:17px;margin:0 0 15px;color:var(--navy)}
    .note{padding:14px 15px;border-radius:14px;background:var(--blue-soft);color:var(--text);font-size:13px;border:1px solid rgba(30,77,143,.06)}
    .footer{
      margin-top:44px;border-top:1px solid rgba(14,43,102,.08);padding:20px 0 0;display:flex;justify-content:space-between;
      gap:15px;flex-wrap:wrap;font-size:12px;color:var(--muted)
    }
    .toast{
      position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(15px);opacity:0;pointer-events:none;transition:.25s;
      background:linear-gradient(135deg,var(--navy) 0%, var(--navy-2) 100%);color:white;border-radius:14px;padding:12px 18px;font-size:13px;
      z-index:100;box-shadow:0 18px 30px rgba(14,43,102,.18)
    }
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    @media(max-width:980px){
      .hero{grid-template-columns:1fr}
      .cards{grid-template-columns:repeat(2,1fr)}
      .detail-grid{grid-template-columns:1fr}
    }
    @media(max-width:800px){
      .shell{padding:0 16px 60px}
      .site-header{padding:14px 0;min-height:auto;flex-wrap:wrap}
      .toplinks{width:100%;order:2}
      .hero-main{min-height:290px;padding:28px 24px}
      h1{font-size:40px}
      .field-grid,.room-grid,.detail-list,.flowgrid{grid-template-columns:1fr}
      .summary{min-height:unset}
    }
    @media(max-width:560px){
      .cards{grid-template-columns:1fr}
      .brand-copy strong{font-size:21px}
      h1{font-size:34px}
      .page-head h1{font-size:29px}
      .panel{padding:20px}
      .navbtn{padding:8px 11px}
      .demo-label{font-size:10px}
      .role-caption{width:100%}
      .feature-pills{gap:8px}
      .pill{font-size:13px;padding:10px 13px}
    }

    /* Android / PWA layout layer. The desktop theme is retained. */
    html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
    body{overscroll-behavior-y:contain;-webkit-tap-highlight-color:transparent}
    button,a,input,select,summary{touch-action:manipulation}
    button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid rgba(35,180,182,.55);outline-offset:2px}
    .mobile-tabs{display:none}
    .upload-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
    .upload-choice{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid #CFE0EF;background:#EDF3FF;color:#0E2B66;border-radius:12px;padding:10px 13px;font-size:13px;font-weight:800;cursor:pointer;min-height:46px;position:relative;overflow:hidden}
    .upload-choice.camera{background:#E8FAFA;border-color:#BAE8E6}
    .upload-choice input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
    .camera-guide{font-size:12px;color:var(--muted);margin-top:7px}
    .photo-item{display:inline-flex;position:relative;margin-right:3px}
    .photo-remove{position:absolute;top:-8px;right:-8px;border:none;background:#0E2B66;color:white;width:24px;height:24px;display:grid;place-items:center;border-radius:50%;font-size:17px;line-height:1;box-shadow:0 2px 8px rgba(14,43,102,.16)}
    .upload-count{display:inline-flex;align-items:center;color:var(--muted);font-size:12px;margin-top:7px}
    .room-intro{display:block;font-size:13px;color:var(--muted);margin-bottom:12px}
    .role-caption small{font-weight:500}
    @media(max-width:680px){
      :root{--shadow:0 10px 25px rgba(17,49,95,.075)}
      .shell{padding:0 15px calc(92px + env(safe-area-inset-bottom, 0px));max-width:100%}
      .site-header{min-height:74px;flex-wrap:nowrap;padding:13px 0;border-bottom:1px solid #E9EEF5;gap:6px}
      .brand{gap:10px}.brand-logo{width:43px;height:43px;border-radius:14px;flex-shrink:0}
      .brand-logo svg{width:33px;height:33px}.brand-copy strong{font-size:20px}.brand-copy span{font-size:9px;letter-spacing:2.5px;margin-top:4px}
      .toplinks{display:none}.demo-label{margin-left:auto;white-space:normal;text-align:right;max-width:114px;padding:6px 9px;font-size:10px;line-height:1.35}
      .role-strip{margin:0 -15px;padding:13px 15px 14px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;background:rgba(255,255,255,.85);border-bottom:1px solid #EEF2F6}
      .role-caption{grid-column:1/-1;font-size:12px;color:var(--navy);margin-bottom:0}
      .role-btn{min-width:0;min-height:42px;padding:8px 6px;font-size:12px;border-radius:12px;box-shadow:none}
      .hero{grid-template-columns:1fr;gap:12px;margin:16px 0 26px}
      .hero-main{min-height:0;padding:25px 22px 21px;border-radius:22px}
      .hero-main:after{right:-65px;bottom:0;width:160px;height:160px}
      .eyebrow{font-size:10px;letter-spacing:1.6px;margin-bottom:11px}
      .eyebrow:after{width:35px;height:3px;margin-top:6px}
      .hero h1{font-size:32px;letter-spacing:-1.5px;line-height:1.26}
      .headline-sub{font-size:14px;line-height:1.65;margin-top:14px}
      .feature-pills{gap:6px;margin-top:17px}.pill{padding:8px 11px;font-size:11px;gap:5px;box-shadow:none}.pill .icon{font-size:14px}
      .actions{margin-top:19px;gap:8px}.hero .actions .btn{flex:1;min-width:120px}
      .btn{min-height:47px;padding:11px 13px;font-size:13px;border-radius:13px}
      .summary{padding:21px 20px;border-radius:21px;display:grid;grid-template-columns:1fr 1px 1fr;align-items:center;gap:15px}
      .summary .sum-rule{height:100%;width:1px;margin:0;background:var(--line)}
      .sum-title{font-size:12px}.sum-number{font-size:35px;margin-top:6px}
      .summary .hint{display:none}.summary-chip{margin-top:8px;font-size:10px;padding:6px 9px}
      .section-head{margin:28px 0 14px;align-items:center}.section-head h2{font-size:21px}.section-head p{font-size:12px}.text-btn{font-size:12px;white-space:nowrap}
      .cards{grid-template-columns:1fr;gap:11px}.card{border-radius:17px;padding:19px}.record-card{min-height:160px}
      .card h3{margin:14px 0 5px}.card-bottom{padding-top:12px}
      .flowgrid{grid-template-columns:1fr;gap:10px;margin-top:16px}.flowstep{padding:18px;min-height:102px;border-radius:18px}.flowstep h3{font-size:15px;margin:6px 0 3px}
      .page-head{margin:24px 0 16px}.page-head h1{font-size:28px;letter-spacing:-1.2px}.page-head p{font-size:13px}
      .panel{padding:19px 17px;border-radius:19px;margin-bottom:13px}.panel h2{font-size:18px;margin-bottom:14px}
      .field-grid,.room-grid,.detail-list{grid-template-columns:1fr;gap:12px}.field input,.field select,.field textarea,textarea.comment{font-size:16px;min-height:49px;border-radius:12px}
      .room{padding:17px 15px;border-radius:15px}.room h3{font-size:17px}.room .field label{font-size:13px}
      .detail-grid{grid-template-columns:1fr;gap:2px}.aside .panel{margin-bottom:12px}.detail-room{padding:16px}
      .form-actions{position:sticky;bottom:calc(72px + env(safe-area-inset-bottom, 0px));z-index:8;padding:11px 2px;margin:10px 0;background:linear-gradient(to top, #F7FAFD 72%, rgba(247,250,253,.84));border-radius:14px}
      .form-actions .btn{flex:1}
      .footer{font-size:11px;margin-top:36px;padding-top:17px;line-height:1.7}
      .mobile-tabs{position:fixed;display:grid;grid-template-columns:repeat(3,1fr);bottom:0;left:0;right:0;z-index:50;padding:8px 10px calc(6px + env(safe-area-inset-bottom, 0px));background:rgba(255,255,255,.97);border-top:1px solid #DCE7F2;box-shadow:0 -8px 22px rgba(14,43,102,.06);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
      .mobile-tab{background:transparent;border:none;min-height:54px;display:flex;gap:3px;flex-direction:column;align-items:center;justify-content:center;color:#8293AB;font-size:10px;font-weight:800;border-radius:12px}
      .mobile-tab svg{width:22px;height:22px;display:block}.mobile-tab.active{color:var(--navy);background:#E8FAFA}
      .mobile-tab-create svg{color:var(--teal)}
      .toast{bottom:calc(85px + env(safe-area-inset-bottom, 0px));width:max-content;max-width:calc(100vw - 30px);text-align:center}
      .upload-choice{flex:1}
      .upload-count{margin-bottom:3px}
    }
    @media(max-width:360px){
      .hero h1{font-size:29px}.pill{font-size:10px;padding:7px 8px}.feature-pills{gap:5px}
      .summary{gap:10px;padding:18px 13px}.sum-title{font-size:11px}.sum-number{font-size:33px}
    }

  </style>
</head>
<body>
  <div class="shell">
    <header class="site-header">
      <div class="brand">
        <div class="brand-logo" aria-hidden="true"><svg width="44" height="44" viewBox="40 8 188 176" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M59 75L135 25L183 57" stroke="#082749" stroke-width="15" stroke-linecap="square"/><path d="M59 75V163H131" stroke="#082749" stroke-width="16"/><path d="M117 108L151 141L209 74" stroke="#FF973B" stroke-width="15" stroke-linecap="square"/><path d="M145 166H199Q211 166 211 154V110" stroke="#4CB5B9" stroke-width="16" stroke-linecap="square"/></svg></div>
        <div class="brand-copy"><strong>집체크</strong><span>ZIPCHECK</span></div>
      </div>
      <div class="toplinks" id="nav"></div>
      <span class="demo-label">안드로이드 시연 버전</span>
    </header>

    <div class="role-strip" id="roles"></div>
    <main id="app"></main>
    <footer class="footer">
      <span>ZipCheck · 입·퇴거 상태를 함께 기록하고 확인하는 비대면 점검 서비스</span>
      <span>체험용 데이터는 이 브라우저에만 저장됩니다. 실제 개인정보를 입력하지 마세요.</span>
    </footer>
  </div>
  <nav class="mobile-tabs" id="mobile-tabs" aria-label="하단 메뉴">
    <button type="button" class="mobile-tab" data-page="home" aria-label="홈">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7"/><path d="M5 9v12h14V9"/><path d="M9 21v-7h6v7"/></svg><span>홈</span>
    </button>
    <button type="button" class="mobile-tab" data-page="records" aria-label="점검 목록">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4.5V3h6v1.5M9 11h6m-6 4h6"/></svg><span>점검 목록</span>
    </button>
    <button type="button" class="mobile-tab mobile-tab-create" data-page="new" aria-label="새 점검">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span>새 점검</span>
    </button>
  <button type="button" class="mobile-tab" data-page="profile" aria-label="중개사 프로필"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="7" r="4"/><path d="M4 21q0-9 8-9t8 9"/></svg><span>중개사</span></button>
  </nav>
  <div id="toast" class="toast"></div>

  <script>
    'use strict';
    const KEY = 'zipcheck-mvp-v2-ppt-tone';
    const ROOMS = ['현관', '거실', '주방', '욕실', '침실'];
    const ROLES = ['임차인', '공인중개사', '임대인'];
    const today = () => new Date().toLocaleDateString('sv-SE');
    const now = () => new Date().toLocaleString('ko-KR');
    const makeSeed = () => [{
      id:'demo-1001',
      name:'샘플 아파트 101동 502호',
      type:'퇴거',
      date:today(),
      createdAt:now(),
      brokerChecked:false,
      ownerChecked:false,
      rooms:ROOMS.map((r,i)=>({
        name:r,
        state:i===2?'확인 필요':'양호',
        memo:i===2?'싱크대 하부에 작은 생활 흔적이 있습니다.':'특이사항 없음',
        photos:[]
      })),
      logs:[{role:'임차인',text:'퇴거 점검 기록을 등록했습니다.',time:now()}]
    }];
    function load(){ try{ const raw=localStorage.getItem(KEY); return raw?JSON.parse(raw):makeSeed(); } catch { return makeSeed(); } }
    let records = load();
    let role = '임차인', page = 'home', selectedId = null, photosDraft = {};
    const $ = id => document.getElementById(id);
    const esc = s => String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function save(){
      try { localStorage.setItem(KEY, JSON.stringify(records)); return true; }
      catch { toast('저장 공간이 부족합니다. 사진 개수를 줄여 주세요.'); return false; }
    }
    function toast(message){
      const el = $('toast');
      el.textContent = message;
      el.classList.add('show');
      clearTimeout(toast.t);
      toast.t = setTimeout(()=>el.classList.remove('show'), 2600);
    }
    function status(rec){ return rec.brokerChecked && rec.ownerChecked ? '확인 완료' : '검토 중'; }
    function badge(rec){ return `<span class="tag ${status(rec)==='확인 완료'?'':'orange'}">${status(rec)}</span>`; }
    function renderNav(){
      $('nav').innerHTML = [['home','홈'],['records','점검 목록'],['new','새 점검'],['profile','중개사']]
        .map(([p,t])=>`<button type="button" class="navbtn ${page===p?'active':''}" data-page="${p}">${t}</button>`).join('');
      $('roles').innerHTML = `<span class="role-caption">사용자 역할 <small>· 체험 모드</small></span>`+
        ROLES.map(r=>`<button type="button" class="role-btn ${role===r?'active':''}" data-role="${r}" aria-pressed="${role===r}">${r}</button>`).join('');
      const tabs=$('mobile-tabs'); if(tabs){ tabs.querySelectorAll('[data-page]').forEach(el=>{el.classList.toggle('active',el.dataset.page===page);el.setAttribute('aria-current',el.dataset.page===page?'page':'false')}); }
    }
let pendingDeleteId=null;
function canDelete(r){return role==='임차인'&&!r.brokerChecked&&!r.ownerChecked}
function requestDelete(id){
 const r=records.find(x=>x.id===id);
 if(!r||!canDelete(r)){toast('검토 전 기록만 임차인이 삭제할 수 있습니다.');return;}
 pendingDeleteId=id;
 if(confirm('아직 검토되지 않은 점검 기록을 삭제할까요? 삭제 후 복구할 수 없습니다.')){
  const prev=records; records=records.filter(x=>x.id!==id);
  if(!save())records=prev;
  else{selectedId=null;if(page==='detail')goto('records');else render();toast('점검 기록을 삭제했습니다.')}
 }
 pendingDeleteId=null;
}
    function card(rec){
      return `<article class="card record-card"><div class="record-main" data-open="${esc(rec.id)}" role="button" tabindex="0">
        <div class="card-top">${badge(rec)}<span class="date">${esc(rec.date)}</span></div>
        <h3>${esc(rec.name)}</h3>
        <div class="meta">${esc(rec.type)} 점검 · 공간 ${rec.rooms.length}곳</div>
        </div><div class="record-actions"><span class="card-bottom">점검 기록 확인 →</span>${canDelete(rec)?`<button type="button" class="delete-record" data-delete="${esc(rec.id)}">삭제</button>`:""}</div>
      </article>`;
    }
    function renderHome(){
      const roleText = {
        '임차인':'입·퇴거 전 주택 상태를 사진과 체크리스트로 기록해 보세요.',
        '공인중개사':'임차인이 남긴 기록을 검토하고 중개사 의견을 추가해 보세요.',
        '임대인':'공유된 기록을 최종 확인하고 공동 확인 절차를 완성해 보세요.'
      }[role];
      const pending = records.filter(r=>status(r)!=='확인 완료').length;
      return `
        <section class="hero">
          <div class="hero-main">
            <div>
              <span class="eyebrow">ZIPCHECK PROJECT PROPOSAL</span>
              <h1>사진으로 시작하는<br><span class="accent accent-swoosh">안심 이사</span></h1>
              <span class="headline-sub">${roleText}</span>
              <div class="feature-pills">
                <span class="pill teal"><span class="icon">📷</span> 비대면 점검</span>
                <span class="pill blue"><span class="icon">🖼️</span> 사진 인증</span>
                <span class="pill orange"><span class="icon">✓</span> 공동 확인</span>
              </div>
            </div>
            <div class="actions">
              ${role==='임차인' ? '<button class="btn primary" data-page="new">+ 새 점검 시작</button>' : ''}
              <button class="btn secondary" data-page="records">점검 기록 보기 →</button>
            </div>
          </div>
          <div class="summary">
            <div>
              <span class="sum-title">등록된 점검 기록</span>
              <div class="sum-number">${records.length}<span>건</span></div>
            </div>
            <div class="sum-rule"></div>
            <div>
              <span class="sum-title">공동 확인 진행 중</span>
              <div class="sum-number">${pending}<span>건</span></div>
              <p class="hint">역할을 전환하면 같은 기록을 서로 다른 관점에서 체험할 수 있어요.</p>
              <span class="summary-chip">현재 역할 · ${role}</span>
            </div>
          </div>
        </section>

        <div class="section-head">
          <div>
            <h2>최근 점검 기록</h2>
            <p>등록된 공간의 입·퇴거 상태와 확인 진행 현황을 볼 수 있습니다.</p>
          </div>
          <button class="text-btn" data-page="records">전체 보기 →</button>
        </div>
        ${records.length ? `<div class="cards">${records.slice(0,3).map(card).join('')}</div>` : '<div class="empty"><strong>아직 등록된 점검이 없습니다.</strong>새 점검을 시작해 보세요.</div>'}

        <div class="section-head">
          <div>
            <h2>집체크 이용 흐름</h2>
            <p>임차인 · 공인중개사 · 임대인이 하나의 기록을 함께 확인합니다.</p>
          </div>
        </div>
        <div class="flowgrid">
          <div class="flowstep"><span class="stepnum">STEP 01 · 임차인</span><h3>사진과 점검 기록 등록</h3><p>공간별 체크리스트와 상태 메모, 사진을 입력합니다.</p></div>
          <div class="flowstep"><span class="stepnum">STEP 02 · 공인중개사</span><h3>내용 검토 및 의견 작성</h3><p>기록을 검토한 뒤 특이사항이나 전달 내용을 남깁니다.</p></div>
          <div class="flowstep"><span class="stepnum">STEP 03 · 임대인</span><h3>최종 확인 완료</h3><p>최종 확인을 마치면 공동 점검 기록이 완성됩니다.</p></div>
        </div>`;
    }
    function renderRecords(){
      return `<div class="page-head"><span class="eyebrow">Inspection Records</span><h1>점검 목록</h1><p>등록된 기록을 선택하면 공간별 상태와 참여자의 확인 여부를 볼 수 있습니다.</p></div>
      ${records.length ? `<div class="cards">${records.map(card).join('')}</div>` : '<div class="empty"><strong>등록된 기록이 없습니다.</strong>새 점검을 등록해 보세요.</div>'}
      <div class="broker-peek"><span class="peek-graphic">👤</span><div class="peek-copy"><strong>담당 공인중개사</strong><p>협의 평판과 활동 이력을 확인해 보세요.</p></div><button type="button" class="btn secondary" data-page="profile">프로필 보기 →</button></div><div class="actions"><button class="btn ghost" id="export">기록 JSON 내보내기</button></div>`;
    }
    function roomEditor(room){
      const r = esc(room);
      return `<div class="room"><h3>${r}</h3><span class="room-intro">전체 공간이 보이도록 촬영한 후 상태를 기록해 주세요.</span><div class="field"><label for="state-${r}">현재 상태</label><select id="state-${r}" name="state-${r}"><option>양호</option><option>확인 필요</option><option>파손 의심</option><option>해당 없음</option></select></div><div class="field"><label for="memo-${r}">상태 메모</label><textarea id="memo-${r}" name="memo-${r}" rows="2" placeholder="예: 벽지에 작은 자국이 있습니다."></textarea></div><div class="field"><span class="label">사진 첨부 (선택)</span><div class="upload-actions"><label class="upload-choice">🖼️ 갤러리 선택<input type="file" accept="image/*" data-upload="${r}" multiple aria-label="${r} 사진 선택"></label><label class="upload-choice camera">📷 카메라 촬영<input type="file" accept="image/*" capture="environment" data-upload="${r}" aria-label="${r} 카메라 촬영"></label></div><div class="camera-guide">사진은 최대 4장까지 저장됩니다. 밝은 곳에서 비슷한 각도로 촬영하세요.</div><div class="photo-list" id="previews-${r}" aria-live="polite"></div></div></div>`;
    }
    function renderNew(){
      if(role !== '임차인') return `<div class="page-head"><h1>새 점검 등록</h1><p>점검 등록은 임차인 역할에서 체험할 수 있습니다.</p></div><div class="panel"><p class="meta">상단의 사용자 역할을 <strong>임차인</strong>으로 바꿔주세요.</p><div class="actions"><button class="btn secondary" data-role="임차인">임차인으로 전환</button></div></div>`;
      return `<div class="page-head"><span class="eyebrow">New Inspection</span><h1>새 입·퇴거 점검</h1><p>실제 거주지 정보 대신 예시 주소를 사용해 주세요.</p></div>
      <form id="inspection-form">
        <div class="panel">
          <h2>기본 정보</h2>
          <div class="field-grid">
            <div class="field"><label for="name">점검 대상 공간</label><input id="name" name="name" required maxlength="80" placeholder="예: 샘플 아파트 101동 502호"></div>
            <div class="field"><label for="type">점검 종류</label><select id="type" name="type"><option>입주</option><option selected>퇴거</option></select></div>
            <div class="field"><label for="date">점검일</label><input id="date" type="date" name="date" value="${today()}" required></div>
          </div>
        </div>
        <div class="panel">
          <h2>공간별 점검 체크리스트</h2>
          <p class="meta" style="margin-bottom:17px">공간별 상태를 같은 기준으로 기록하면 입주·퇴거 기록을 비교하기 쉬워집니다.</p>
          <div class="room-grid">${ROOMS.map(roomEditor).join('')}</div>
        </div>
        <div class="form-actions"><button type="button" class="btn secondary" data-page="home">취소</button><button type="submit" class="btn primary">점검 기록 저장 →</button></div>
      </form>`;
    }
function renderProfile(){
return `<div class="profile-page"><div class="page-head"><span class="eyebrow">BROKER PROFILE</span><h1>공인중개사 프로필</h1><p>입·퇴거 협의를 지원하는 담당자 정보</p></div>
<section class="profile-panel"><div class="profile-header"><div class="profile-photo"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="50" fill="#E5F2FA"/><path d="M11 100Q15 70 36 68L50 83L64 68Q85 72 89 100" fill="#244A83"/><path d="M38 63H62V78L50 90L38 78Z" fill="#E9B38B"/><path d="M42 78L50 90L58 78L67 100H33Z" fill="white"/><ellipse cx="50" cy="45" rx="23" ry="29" fill="#F3C49D"/><path d="M27 42Q24 17 47 17Q67 11 73 29L76 44L66 38Q55 24 37 35L28 48Z" fill="#253554"/><circle cx="42" cy="48" r="2" fill="#28364D"/><circle cx="58" cy="48" r="2" fill="#28364D"/><path d="M44 60Q50 64 56 60" stroke="#A9675F" stroke-width="2" fill="none"/></svg></div><div class="profile-heading"><h2>김지훈 중개사</h2><p>행복부동산 · 공인중개사 프로필</p><div class="profile-tags"><span class="profile-tag">✓ 시연용 프로필</span><span class="profile-tag violet">✦ 협의 지원</span></div></div></div>
<div class="profile-disclaimer">※ 이름, 82점, 활동 배지, 활동 이력은 모두 가상 시연 데이터이며 실제 중개사 자격이나 실적을 인증하지 않습니다.</div>
<div class="score-panel" style="margin-top:16px"><div class="score-title">☀️ 협의 맑음도 <small>· 예시 지표</small></div><div class="score-main"><p>응답 속도, 증빙 충실도, 일정 준수를 한눈에 확인하는 예시 지표예요.</p><div class="score-number">82<small>점</small></div></div><div class="progress-track"><div class="progress-bar"></div></div><div class="score-stats"><div class="score-stat"><span>⚡ 응답 속도</span><strong>빠름</strong></div><div class="score-stat"><span>▣ 증빙 충실도</span><strong>높음</strong></div><div class="score-stat"><span>▢ 일정 준수</span><strong>우수</strong></div></div></div>
<div class="profile-section-head">활동 배지 4개 <small>예시</small></div><div class="badge-grid"><div class="profile-badge"><span class="badge-icon">💬</span><strong>빠른 응답</strong><small>빠른 소통</small></div><div class="profile-badge"><span class="badge-icon">📑</span><strong>증빙 꼼꼼</strong><small>서류 확인</small></div><div class="profile-badge"><span class="badge-icon">🗓️</span><strong>약속 준수</strong><small>일정 관리</small></div><div class="profile-badge"><span class="badge-icon">🤝</span><strong>협의 경험</strong><small>분쟁 조율</small></div></div>
<div class="profile-section-head">최근 협의 내역 <small>가상 기록</small></div>
<div class="history-line"><span class="hist-icon">🛠️</span><div class="hist-desc"><strong>벽지 보수 범위 협의 완료</strong><small>7월 16일 · 견적 공동 확인</small></div><span class="hist-badge">완료</span></div>
<div class="history-line"><span class="hist-icon">🧽</span><div class="hist-desc"><strong>에어컨 청소 여부 확인</strong><small>7월 12일 · 사진 확인</small></div><span class="hist-badge">완료</span></div>
<div class="history-line"><span class="hist-icon">🧹</span><div class="hist-desc"><strong>퇴거 청소 일정 조율</strong><small>7월 8일 · 일정 협의</small></div><span class="hist-badge">조율</span></div>
</section></div>`;
}
    function renderDetail(){
      const r = records.find(x=>x.id===selectedId);
      if(!r) return '<div class="empty">기록을 찾을 수 없습니다.</div>';
      const statuses = `<div class="check done">✓ 임차인 · 점검 기록 등록</div><div class="check ${r.brokerChecked?'done':''}">${r.brokerChecked?'✓':'○'} 공인중개사 · ${r.brokerChecked?'검토 완료':'검토 대기'}</div><div class="check ${r.ownerChecked?'done':''}">${r.ownerChecked?'✓':'○'} 임대인 · ${r.ownerChecked?'확인 완료':'확인 대기'}</div>`;
      const checkAction = ((role==='공인중개사'&&!r.brokerChecked)||(role==='임대인'&&!r.ownerChecked))
        ? `<div class="confirm-panel"><strong>${role==='공인중개사'?'중개사 검토 의견':'임대인 확인 의견'}</strong><p class="meta">확인 전 사진과 메모를 검토해 주세요.</p><form id="review-form"><textarea class="comment" name="comment" maxlength="500" placeholder="의견을 작성해 주세요. (선택)"></textarea><button type="submit" class="btn primary" style="width:100%">${role==='공인중개사'?'검토 완료 처리':'확인 완료 처리'}</button></form></div>`
        : `<div class="note">${role==='임차인'?'중개사와 임대인으로 역할을 바꿔 공동 확인 과정을 체험해 보세요.':role==='공인중개사'?'이 점검 기록에 대한 중개사 검토를 마쳤습니다.':'이 점검 기록에 대한 임대인 확인을 마쳤습니다.'}</div>`;
      return `<div class="page-head"><button class="text-btn" data-page="records">← 점검 목록</button><div style="margin-top:16px">${badge(r)}</div><h1>${esc(r.name)}</h1><p>${esc(r.type)} 점검 · 점검일 ${esc(r.date)} · 임차인이 등록</p><div class="detail-utility"><button type="button" class="btn secondary" data-page="profile">👤 공인중개사 프로필</button>${canDelete(r)?`<button type="button" class="delete-record" data-delete="${esc(r.id)}">점검 삭제</button>`:""}</div></div>
      <div class="detail-grid">
        <section>
          <div class="panel"><h2>공간별 점검 결과</h2><div class="detail-list">${r.rooms.map(x=>`<div class="detail-room"><strong>${esc(x.name)}</strong><div class="state-label">${esc(x.state)}</div><p>${esc(x.memo||'작성된 메모가 없습니다.')}</p>${x.photos?.length?`<div class="photos">${x.photos.map(src=>`<a href="${src}" target="_blank" rel="noopener noreferrer"><img src="${src}" alt="${esc(x.name)} 점검 사진"></a>`).join('')}</div>`:'<p class="hint">등록된 사진 없음</p>'}</div>`).join('')}</div></div>
          <div class="panel"><h2>확인 내역</h2><div class="timeline">${r.logs.map(l=>`<div class="event"><strong>${esc(l.role)}</strong><p>${esc(l.text)}</p><small>${esc(l.time)}</small></div>`).join('')}</div></div>
        </section>
        <aside class="aside"><div class="panel"><h3>공동 확인 현황</h3>${statuses}${checkAction}</div><div class="note">이 화면의 확인 표시는 실제 전자서명이나 법적 효력 있는 인증이 아닌 시연용 기능입니다.</div></aside>
      </div>`;
    }
    function render(){
      renderNav();
      $('app').innerHTML = page==='home' ? renderHome() : page==='records' ? renderRecords() : page==='new' ? renderNew() : page==='profile' ? renderProfile() : renderDetail();
      window.scrollTo({top:0, behavior:'auto'});
    }
    function goto(p, fromHistory=false){
      if(p==='new' && page!==p) photosDraft={};
      page=p;
      if(!fromHistory){ try{history.pushState({zipcheckPage:p,selectedId},'',location.pathname+location.search+location.hash)}catch{} }
      render();
    }
    window.addEventListener('popstate',e=>{
      const state=e.state||{}; page=state.zipcheckPage||'home'; selectedId=state.selectedId||null;
      if(page==='detail' && !selectedId)page='records'; render();
    });
    function imageToSmallDataURL(file){
      return new Promise((resolve,reject)=>{
        const reader = new FileReader();
        reader.onerror = ()=>reject(new Error('이미지 읽기 실패'));
        reader.onload = ()=>{
          const img = new Image();
          img.onerror = ()=>reject(new Error('이미지 형식 오류'));
          img.onload = ()=>{
            const max = 820;
            const scale = Math.min(1, max / Math.max(img.width, img.height));
            const canvas = document.createElement('canvas');
            canvas.width = Math.round(img.width * scale);
            canvas.height = Math.round(img.height * scale);
            const c = canvas.getContext('2d');
            c.fillStyle = '#fff';
            c.fillRect(0,0,canvas.width,canvas.height);
            c.drawImage(img,0,0,canvas.width,canvas.height);
            resolve(canvas.toDataURL('image/jpeg', .65));
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }
    function paintPhotoPreview(room){
      const target=$('previews-'+room);
      if(!target) return;
      target.innerHTML=(photosDraft[room]||[]).map((src,i)=>`<span class="photo-item"><img class="photo-mini" src="${src}" alt="${esc(room)} 사진 ${i+1}"><button type="button" class="photo-remove" data-remove-photo="${esc(room)}" data-photo-index="${i}" aria-label="사진 ${i+1} 제거">×</button></span>`).join('') + `<span class="upload-count">${(photosDraft[room]||[]).length} / 4장</span>`;
    }
    $('app').addEventListener('click',e=>{
      const del=e.target.closest('[data-delete]');if(del){e.preventDefault();e.stopPropagation();requestDelete(del.dataset.delete);return;}
      const rem=e.target.closest('[data-remove-photo]');
      if(rem){const room=rem.dataset.removePhoto;const i=Number(rem.dataset.photoIndex);if(photosDraft[room] && Number.isInteger(i)){photosDraft[room].splice(i,1);paintPhotoPreview(room)}return;}
      const nav = e.target.closest('[data-page]');
      if(nav){ goto(nav.dataset.page); return; }
      const switcher = e.target.closest('[data-role]');
      if(switcher){ role = switcher.dataset.role; render(); return; }
      const item = e.target.closest('[data-open]');
      if(item){ selectedId = item.dataset.open; goto('detail'); return; }
      if(e.target.closest('#export')){
        const blob = new Blob([JSON.stringify(records,null,2)],{type:'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url; a.download = 'zipcheck-demo-records.json'; a.click(); URL.revokeObjectURL(url);
        toast('점검 기록을 내려받았습니다.');
        return;
      }
      if(e.target.closest('#reset')){
        if(confirm('작성한 시연 기록이 삭제되고 샘플 데이터로 초기화됩니다. 계속할까요?')){ records = makeSeed(); save(); render(); toast('샘플 데이터로 초기화했습니다.'); }
        return;
      }
    });
    $('app').addEventListener('keydown',e=>{
      if((e.key==='Enter'||e.key===' ') && e.target.matches('[data-open]')){
        e.preventDefault(); selectedId = e.target.dataset.open; goto('detail');
      }
    });
    $('roles').addEventListener('click',e=>{ const el=e.target.closest('[data-role]'); if(el){ role=el.dataset.role; render(); } });
    $('nav').addEventListener('click',e=>{ const el=e.target.closest('[data-page]'); if(el) goto(el.dataset.page); });
    $('mobile-tabs').addEventListener('click',e=>{const el=e.target.closest('[data-page]');if(el) goto(el.dataset.page);});
    $('app').addEventListener('change', async e=>{
      const el = e.target.closest('[data-upload]'); if(!el) return;
      const room = el.dataset.upload;
      const files = Array.from(el.files||[]).slice(0,3);
      if(!files.length) return;
      toast('사진을 준비하는 중입니다.');
      try{
        const out = await Promise.all(files.map(imageToSmallDataURL));
        photosDraft[room] = [ ...(photosDraft[room]||[]), ...out ].slice(0,4);
        paintPhotoPreview(room);
        toast(`${room} 사진이 준비됐습니다.`);
      }catch{
        toast('사진을 처리하지 못했습니다. 다른 파일로 시도해 주세요.');
      }finally{ el.value=''; }
    });
    $('app').addEventListener('submit',e=>{
      if(e.target.id==='inspection-form'){
        e.preventDefault();
        const form = new FormData(e.target);
        const name = String(form.get('name')||'').trim();
        if(!name){ toast('점검 대상 공간을 입력해 주세요.'); return; }
        const rec = {
          id:'zip-'+Date.now(),
          name,
          type:String(form.get('type')),
          date:String(form.get('date')),
          createdAt:now(),
          brokerChecked:false,
          ownerChecked:false,
          rooms:ROOMS.map(r=>({name:r,state:String(form.get('state-'+r)||'양호'),memo:String(form.get('memo-'+r)||'').trim(),photos:photosDraft[r]||[]})),
          logs:[{role:'임차인',text:'입·퇴거 점검 기록을 등록했습니다.',time:now()}]
        };
        records.unshift(rec);
        if(!save()){ records.shift(); return; }
        photosDraft = {};
        selectedId = rec.id;
        goto('detail');
        toast('점검 기록이 저장됐습니다.');
        return;
      }
      if(e.target.id==='review-form'){
        e.preventDefault();
        const rec = records.find(x=>x.id===selectedId); if(!rec) return;
        const comment = String(new FormData(e.target).get('comment')||'').trim();
        if(role==='공인중개사') rec.brokerChecked = true;
        else if(role==='임대인') rec.ownerChecked = true;
        else return;
        rec.logs.push({role,text:(role==='공인중개사'?'점검 기록을 검토했습니다.':'점검 기록을 확인했습니다.')+(comment?' 의견: '+comment:''),time:now()});
        save(); render(); toast(`${role}의 확인이 반영됐습니다.`);
      }
    });
    try { history.replaceState({zipcheckPage:'home', selectedId:null},'',location.pathname+location.search+location.hash); }catch{}
    if(!navigator.userAgent.includes('ZipCheckAndroid') && 'serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')) {
      window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
    }
    render();
  </script>
</body>
